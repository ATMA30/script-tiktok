name: Render TikTok video

on:
  workflow_dispatch:
    inputs:
      projet:
        description: "Nom du projet (dossier dans projets/). Vide = dernier"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "projets/**/script.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install system deps (ffmpeg + Chromium headless deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1 \
            libpangocairo-1.0-0 libcups2 libxss1 libdrm2 fonts-liberation \
            libu2f-udev xdg-utils

      - name: Install Python deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache npx HyperFrames + Puppeteer Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          # Le cache npm/Puppeteer ne dépend que de la version de HyperFrames, pas du code Python.
          key: hf-${{ runner.os }}-0.5.7

      - name: Prefetch HyperFrames CLI (warm npx cache)
        run: npx --yes hyperframes@0.5.7 --help || true

      - name: Generate audio (Gemini or Edge-TTS fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 2_generate_audio.py

      # Pas de GEMINI_API_KEY ici : seul le Director Agent (désactivé) l'utilise au rendu.
      # inputs.projet passe par l'env (jamais interpolé dans le script shell).
      - name: Render with HyperFrames (headless)
        env:
          PROJET: ${{ inputs.projet }}
          USE_SEMANTIC_OVERLAYS: "0"
          USE_DIRECTOR_AGENT: "0"
        run: |
          if [ -n "$PROJET" ]; then
            case "$PROJET" in
              */* | .*) echo "Nom de projet invalide : $PROJET" >&2; exit 1 ;;
            esac
            python 3_render_hyperframes.py --projet "projets/$PROJET"
          else
            python 3_render_hyperframes.py
          fi

      - name: Upload final MP4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiktok-video-${{ github.run_number }}
          path: projets/**/final.mp4
          retention-days: 30
          if-no-files-found: error
