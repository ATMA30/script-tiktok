[tool.ruff]
target-version = "py311"
extend-exclude = ["_archive", ".agents", "hyperframes_render", "projets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# zip() sans strict= : la troncature au plus court est le comportement attendu ici.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
